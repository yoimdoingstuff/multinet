name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version metadata
        run: |
          cmake -DSOURCE_DIR="${GITHUB_WORKSPACE}" -DRELEASE_TAG=v0.8.0 -P scripts/check-release-version.cmake
          cmake -DSOURCE_DIR="${GITHUB_WORKSPACE}" -DRELEASE_TAG=v0.8.0-rc.1 -P scripts/check-release-version.cmake
      - name: Build without optional encryption
        run: |
          cmake -S . -B build-no-crypto -DMULTINET_ENABLE_ENCRYPTION=OFF -DMULTINET_BUILD_DEMO=OFF -DMULTINET_BUILD_TESTS=OFF
          cmake --build build-no-crypto --parallel
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build library, demo and tests
        run: cmake --build build --parallel
      - name: Run loopback integration tests
        run: ctest --test-dir build --output-on-failure
      - name: Install package
        run: cmake --install build --prefix install
      - name: Configure installed-package consumer
        run: cmake -S tests/installed_consumer -B build/installed-consumer -DMultiNet_DIR=${{ github.workspace }}/install/lib/cmake/MultiNet
      - name: Build and run installed-package consumer
        run: |
          cmake --build build/installed-consumer --parallel
          ./build/installed-consumer/multinet_consumer
      - name: Add metadata to distributable package
        run: |
          cmake -E copy README.md install/README.md
          cmake -E copy TODO.md install/TODO.md
          cmake -E copy docs/API.md install/API.md
          cmake -E copy docs/CONNECTION_FALLBACKS.md install/CONNECTION_FALLBACKS.md
      - name: Upload Linux library and demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiNet-linux-x64
          path: install/
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build library, demo and tests
        run: cmake --build build --config Release --parallel
      - name: Smoke-test double-click GUI startup
        shell: pwsh
        run: |
          $gui = Start-Process -FilePath ".\\build\\Release\\multinet_demo.exe" -PassThru
          Start-Sleep -Seconds 2
          $gui.Refresh()
          if ($gui.HasExited) {
            throw "The Windows GUI demo exited immediately instead of staying open."
          }
          Stop-Process -Id $gui.Id -Force

          $rfcommGui = Start-Process -FilePath ".\\build\\Release\\multinet_rfcomm_demo.exe" -PassThru
          Start-Sleep -Seconds 2
          $rfcommGui.Refresh()
          if ($rfcommGui.HasExited) {
            throw "The Bluetooth RFCOMM GUI demo exited immediately instead of staying open."
          }
          Stop-Process -Id $rfcommGui.Id -Force
      - name: Run loopback integration tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install package
        run: cmake --install build --config Release --prefix install
      - name: Configure installed-package consumer
        run: cmake -S tests/installed_consumer -B build/installed-consumer -A x64 -DMultiNet_DIR=${{ github.workspace }}/install/lib/cmake/MultiNet
      - name: Build and run installed-package consumer
        shell: pwsh
        run: |
          cmake --build build/installed-consumer --config Release --parallel
          .\build\installed-consumer\Release\multinet_consumer.exe
      - name: Add metadata to distributable package
        shell: pwsh
        run: |
          Copy-Item README.md install/README.md
          Copy-Item TODO.md install/TODO.md
          Copy-Item docs/API.md install/API.md
          Copy-Item docs/CONNECTION_FALLBACKS.md install/CONNECTION_FALLBACKS.md
      - name: Upload Windows library and demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiNet-windows-x64
          path: install/
          if-no-files-found: error
          retention-days: 30

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Clang libFuzzer target
        run: |
          clang --version
          CC=clang cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMULTINET_BUILD_FUZZERS=ON -DMULTINET_BUILD_DEMO=OFF -DMULTINET_BUILD_TESTS=OFF
      - name: Build fuzz target
        run: cmake --build build-fuzz --parallel
      - name: Fuzz packet framing and player-state payloads
        run: ./build-fuzz/multinet_packet_fuzzer -max_len=1472 -runs=10000
